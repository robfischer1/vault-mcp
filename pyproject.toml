[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-mcp"
version = "0.4.0"
description = "FastMCP server exposing an Obsidian vault as read-only query tools over MCP."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rob Fischer" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0",
    "watchdog>=4.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/robfischer1/vault-mcp"
Documentation = "https://github.com/robfischer1/vault-mcp/tree/main/docs"
Repository = "https://github.com/robfischer1/vault-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Opt-out model: enable everything, disable the noise (the canonical policy —
# see Forge/Governance/Code-Standards.md). ALL auto-adopts new rules on ruff
# upgrade, so treat `pre-commit autoupdate` as a review-new-rules event.
select = ["ALL"]
ignore = [
    # Formatter's job / would fight a formatter
    "COM", "ISC", "Q", "E501",
    # Docstring rule-conflicts — keep D211 + D212, silence the losers
    "D203", "D213",
    # Annotate-everything: we enforce public return types (ANN201) only
    "ANN001", "ANN002", "ANN003", "ANN202", "ANN204", "ANN401",
    # Exception-message ergonomics — pedantic
    "EM", "TRY003",
    # Complexity + magic-number thresholds — opinionated
    "C901", "PLR09", "PLR2004",
    # Intentional patterns in this codebase
    "T201",     # deliberate CLI prints
    "PLC0415",  # deferred / optional-dependency imports
    "FBT", "SLF001",
    "PLW0603",          # module-level singletons set in init fns — the FastMCP server pattern
    "TRY300", "TRY301", # opinionated exception-flow nudges
    "ARG002",           # unused args are usually interface/handler conformance
    "PERF401", "PERF403", # codebase prefers explicit readable loops to comprehensions here
]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely, use subprocess/temp dirs, late imports, no docs/packaging
"tests/**" = ["S", "PT", "ANN", "D", "ARG", "PLR2004", "SLF001", "INP001", "ERA001", "E402", "PLW1510"]
# Benchmarks are throwaway scripts
"benchmarks/**" = ["INP001", "T201", "D", "ANN", "S", "PLR2004", "ERA001"]
# gitops wraps git subprocesses with deliberately fail-safe boundaries (logged, never propagated)
"src/vault_mcp/gitops.py" = ["S603", "BLE001"]
# cli_client shells out to the obsidian binary (configured path / allowlisted commands)
"src/vault_mcp/cli_client.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# phdb is an optional sibling package resolved on sys.path at runtime (atom
# emit / triple tools), never a declared dependency of this publish-track
# server. It ships no type stubs, so its imports are untyped here.
[[tool.mypy.overrides]]
module = "phdb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pytest-asyncio]
mode = "auto"
