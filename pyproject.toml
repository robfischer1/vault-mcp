[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-mcp"
version = "0.4.1"
description = "FastMCP server exposing an Obsidian vault as read-only query tools over MCP."
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Rob Fischer" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=2.2,<3",
    "watchdog>=6.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    # NOT interchangeable with the stdlib `re` — this is here for `timeout=`.
    # `re.sub` holds the GIL for its entire run, so the ThreadPoolExecutor that
    # used to wrap it could never be preempted and the Bases formula
    # `regex_timeout` bounded nothing at all (vault-mcp#5310): measured wall
    # time was ~2.2s whatever the setting said. `regex` checks the clock during
    # matching, so the configured value IS the ceiling — measured 0.05 -> 0.050s
    # and 1.0 -> 1.000s, per call rather than per match.
    #
    # Floor MEASURED, not guessed: 2022.1.18 is the oldest release tested here
    # that honours `timeout=` (verified against 2024.11.6 as well).
    "regex>=2022.1.18",
    # GIT IN-PROCESS, WHICH IS WHY IT IS A RUNTIME DEPENDENCY AND NOT A
    # CONVENIENCE. gitops.py used to spawn the `git` binary, and the spawn cost
    # three things at once: the bot identity was only a DEFAULT that an
    # inherited GIT_AUTHOR_NAME silently beat (a live defect — the commit went
    # out under whoever started the service); every invocation carried
    # `-c safe.directory=*`, a repo-wide relaxation, to get past git's
    # dubious-ownership guard under the LocalSystem service; and the argument
    # vector could never satisfy ruff's S603/S607 on a cross-platform binary
    # path. dulwich takes author and committer as explicit bytes with no
    # configuration fallback, has no ownership guard to defuse, and is pure
    # Python — so all three are answered by the same change rather than
    # excused. Floor is the version this was written and measured against.
    "dulwich>=1.2.14",
]

[project.urls]
Homepage = "https://github.com/robfischer1/vault-mcp"
Documentation = "https://github.com/robfischer1/vault-mcp/tree/main/docs"
Repository = "https://github.com/robfischer1/vault-mcp"

[project.scripts]
vault-mcp = "vault_mcp.server:main"
vault-mcp-cli = "vault_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    # The fleet's test-only SDK. vault-mcp was one of two Python stars without
    # it (the other is fleet-crew, whose future is unruled) — which is why this
    # suite grew five hand-rolled permissive FakeVaults and no conftest.py.
    # Used here for: the pinned Golden-Fake replay (an un-recorded call RAISES
    # instead of returning a canned success), the hypothesis strategies +
    # invariant library, the fail-loud pytest config, and the three
    # forge-testkit lints the pre-commit config runs. Lives only on the Forgejo
    # PyPI, so its source is pinned below.
    "forge-testkit>=1.3.0",
    # FLOOR IS THE GATE'S PIN, not a guess: foundry-tools' python:ruff-check
    # and python:ruff-format atoms both run `uvx ruff@0.16.3`. Held below it
    # (0.15.17), the local run was blind to CPY001 and to markdown code-block
    # formatting and reported clean on a tree the gate failed — measured
    # 2026-09-10, 91 + 3 findings apart.
    "ruff>=0.16.3",
    "mypy>=2.1.0",
    "pyright==1.1.413",
    "types-PyYAML>=6.0.12.20260518",
    "types-regex>=2024.11.6",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 80

[tool.ruff.lint]
# Opt-out model: enable everything, disable the noise (the canonical policy —
# see Forge/Governance/Code-Standards.md). ALL auto-adopts new rules on ruff
# upgrade, so treat `pre-commit autoupdate` as a review-new-rules event.
select = ["ALL"]
ignore = [
    # Formatter's job / would fight a formatter
    "COM", "ISC", "Q", "E501",
    # Docstring rule-conflicts — keep D211 + D212, silence the losers
    "D203", "D213",
    # Annotate-everything: we enforce public return types (ANN201) only
    "ANN001", "ANN002", "ANN003", "ANN202", "ANN204", "ANN401",
    # Exception-message ergonomics — pedantic
    "EM", "TRY003",
    # Complexity + magic-number thresholds — opinionated
    "C901", "PLR09", "PLR2004",
    # Intentional patterns in this codebase
    "T201",     # deliberate CLI prints
    "PLC0415",  # deferred / optional-dependency imports
    "FBT", "SLF001",
    "PLW0603",          # module-level singletons set in init fns — the FastMCP server pattern
    "TRY300", "TRY301", # opinionated exception-flow nudges
    "ARG002",           # unused args are usually interface/handler conformance
    "PERF401", "PERF403", # codebase prefers explicit readable loops to comprehensions here
    "A002",             # MCP tool params mirror API field names (id/object) — can't rename
    "EXE",              # Windows-developed repo — the executable bit isn't meaningful; shebangs are vestigial
]

[tool.ruff.lint.flake8-type-checking]
# FastMCP EVALUATES A VERB'S ANNOTATIONS WHEN IT REGISTERS IT, so any name used
# in a decorated function's signature must exist at runtime. TC002 does not know
# that and moves such an import into `if TYPE_CHECKING:`, where it raises
# InvalidSignature at import time — measured 2026-08-22, when splitting the
# Bases verbs out of server.py broke `subscribe_base(ctx: Context[...])`.
#
# This TELLS RUFF THE TRUTH rather than silencing it: a decorator listed here
# marks its function's annotations as runtime-evaluated, so TC002 stops
# proposing a move that cannot work. It is a fact about FastMCP, not an opinion
# about the rule — which is why it is a setting and not a suppression, and why
# it is NOT a `tool-conflict:` marker (that is reserved for the ruff/mypy
# divergence, per Rob 2026-08-18).
#
# THE NAME IS THE INSTANCE PATH, not the class method. ruff resolves `@mcp.tool()`
# back to where that `mcp` object is bound, so the entry is
# `vault_mcp.server.mcp.tool`. Measured: "mcp.tool" and
# "mcp.server.fastmcp.FastMCP.tool" both leave TC002 firing; only the instance
# path silences it. If the FastMCP instance ever moves module, this string moves
# with it — and TC002 coming back is the signal.
runtime-evaluated-decorators = ["vault_mcp.server.mcp.tool"]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely, use subprocess/temp dirs, late imports, no docs/packaging
# EXACTLY the rules foundry-stocks' stop-justifications gate ratifies for a test
# glob: NOT_A_PACKAGE | TEST_ERGONOMICS, in ci/lib/stop_justifications.py.
# Ratified by Rob 2026-08-21 (foundry-stocks#596, 61bab337); before that the tier
# stood on a session's authority alone.
#
# THE GATE EXEMPTS AN ENTRY ONLY WHEN EVERY RULE IT NAMES IS EXEMPT, so one extra
# family voids the whole line. The list this replaces named eleven, was therefore
# exempt for nothing, and froze every star carrying it the moment anyone
# hand-committed — measured 2026-08-21, 24 of the 26 Python stars.
#
# WHY THESE SIX. S101 (pytest IS assert) and INP001 (tests are not an importable
# package) are unsatisfiable by construction, which is a different thing from a
# suppression. D / ANN / E402 / PLW1510 are satisfiable and ruled out anyway, as
# churn on test functions that buys nothing the firewall exists to buy.
#
# NOTE `S101`, NOT `S` — the old line silenced ALL of flake8-bandit in tests,
# S608 (SQL injection) included. Of the five families dropped, PLR2004 and
# SLF001 were pure dead weight: both already sit in the global `ignore` above, so
# they silenced nothing here. `PT`, `ARG` and `ERA001` were live.
#
# ⚑ ANYTHING ADDED TO THIS LINE MUST ALREADY BE IN THE GATE'S EXEMPT SET, or
# every star this template touches loses the ability to commit. Widen the gate
# first, with Rob's signoff — never widen this line to route around it.
"tests/**" = ["S101", "ANN", "D", "E402", "PLW1510", "INP001"]
# Benchmarks are throwaway scripts
# INP001 ALONE, which is the gate's ratified idiom: an entry naming only
# INP001 declares that a directory is not an importable package — a fact about
# the layout, not a claim that a tool is wrong.
#
# MEASURED 2026-08-22: of the seven rules this used to name, FIVE were dead.
# T201 and PLR2004 are already in the global `ignore` above, S and ERA001 fire
# nowhere in benchmarks/, and the ANN codes that fire here are covered globally
# too. The entry claimed a population it did not have — exactly what nothing in
# the toolchain detects, since RUF100 reads a `noqa` and has never read a
# config. The one real finding it hid, a missing D103 docstring, is answered
# rather than re-silenced.
"benchmarks/**" = ["INP001"]
# NO src/ CARVE-OUTS REMAIN, and the two that were here are worth a sentence
# because of HOW they went — neither was narrowed, exempted or signed off.
#
# gitops.py carried `S603, BLE001`. BLE001 was DEAD (measured 2026-09-10: that
# module already caught `(OSError, subprocess.SubprocessError)` at every
# boundary, so it silenced nothing). S603 went when the module stopped spawning
# `git` at all and started driving dulwich in-process.
#
# cli_client.py carried `S603` on the `obsidian` spawn. It went when the file
# did: the obsidian-cli bridge is retired, because it could never work in
# production — obsidian-cli uses same-session IPC, vault-mcp is a session-0
# service, the desktop Obsidian is session-1, and the Gate was always built on
# RestNoteIO with no fallback.
#
# ⚑ THE RULE THIS LEAVES BEHIND: a per-file-ignores entry under src/ is not a
# tool disagreeing with you, it is a spawn or a suppression that has not been
# designed away yet. Both of these had a comment explaining why they were
# necessary. Both comments were wrong.


# CPY001 (ruff 0.16 promoted flake8-copyright out of preview, and `select =
# ["ALL"]` adopts a new rule the moment it lands — which is what turned 91
# clean files red on the gate's pinned ruff while the project's own 0.15.17
# said nothing). The answer is the REUSE / SPDX per-file header every other
# Python star in this fleet already carries, stamped on all 91 files, not a
# widened ignore list. Same spelling as athena/nyx/iris/terpsichore:
# `# SPDX-FileCopyrightText: <year> <holder>`.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '(?i)SPDX-FileCopyrightText:.*\d{4}'

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

# The phdb.* override is retired (2026-08-04): phdb was an optional sibling
# resolved on sys.path, and with the triple and vault_notes verbs de-tooled
# vault-mcp no longer imports it at all. mypy flagged the override as unused,
# which is how this was caught.

# Test files are type-checked but not strict.
#
# THE disable_error_code LINE IS GONE. It named twelve codes; measured
# 2026-08-22, nine were already dead and the remaining three (type-arg,
# return-value, arg-type) covered six real errors, five of which were the
# FakeVault protocol gap that the substrate consolidation closed. The last one
# was a genuine typing defect — a heterogeneous dict literal subscripted
# inline, so the value type collapsed to `object` and the annotation was a lie.
# All six are answered; nothing is silenced. mypy is clean on src AND tests.
#
# check_untyped_defs IS ALSO GONE, and it was the one worth removing: with it
# off, mypy never looked INSIDE an unannotated test body, which is where test
# logic lives. Lifting it found six errors, four of them one finding —
# ObsidianNoteIO named the concrete ObsidianCLI in its constructor, so no
# double could conform to it. That seam now depends on a CLIRunner Protocol,
# the same shape the Gate already uses for NoteIO.
#
# WHAT REMAINS, each with the population measured by removing it alone. These
# are LIVE, not dead — recorded so the next reader does not have to re-measure,
# and so this block never claims a population it does not have (the failure
# mode foundry-stocks#5242 exists to catch):
#
#   disallow_untyped_defs     453 errors — annotating every test signature.
#                             This is the same ANN churn Rob already ruled out
#                             for tests in the ruff per-file-ignores above; the
#                             two rulings should not disagree.
#   disallow_incomplete_defs   22 errors — partial signatures, a subset of the
#                             above and only worth doing together with it.
#   disallow_untyped_calls      1 error  — nearly free, but it cascades: it
#                             re-types contexts and pulls the 453 back in.
#   warn_return_any             2 errors — cheap; same cascade caveat.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false

# The vault_mcp.server override is RETIRED (2026-09-10). It carried
# `disable_error_code = ["no-any-return"]` on the claim that the MCP-tool entry
# layer inherently returns boundary `Any`. Measured by emptying the list and
# re-running: mypy --strict is clean over src AND tests with nothing silenced,
# so the entry silenced nothing — the same dead-config shape the tests.*
# block above was already trimmed for. The `dict[str, Any]` boundary decision
# it recorded still stands; it is stated in server.py's own VERIFY block,
# where a reader will actually meet it.

# pyright runs strict as a peer to mypy (the authoritative type gate). mypy owns
# ignore-necessity (warn_unused_ignores), so reportUnnecessaryTypeIgnoreComment
# is off. The carve-outs below are the strict reportX rules that fight mypy's
# documented variance, the Any it permits, or ruff's lint domain.
# server.py was excluded from pyright because it imported the phdb sibling off
# sys.path, which pyright could not resolve on a clean checkout — mypy was its
# sole gate. That import is gone (2026-08-04, the dissolution), so the reason
# for the carve-out is gone with it and server.py is back under the peer gate:
# verified 0 errors / 0 warnings before removing the exclusion.
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
# "." so `tests.substrate` resolves: pytest puts the rootdir on sys.path via
# tests/__init__.py, but pyright reads only what it is told. Without it the
# substrate package is a reportMissingImports error in every file that uses it.
extraPaths = ["src", "."]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = false
# Any-strictness mypy doesn't share.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
# Lint domain — ruff owns unused imports/vars and dead code.
reportUnusedImport = false
reportUnusedVariable = false
reportUnusedFunction = false
# Package-internal `_helpers` shared across modules; version deprecation nags.
reportPrivateUsage = false
reportDeprecated = false
# Stricter-than-mypy pattern checks that fight legitimate idioms (conditional
# constants, optional-dep base shims, defensive isinstance / None compares).
reportConstantRedefinition = false
reportUntypedBaseClass = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false

# Tests aren't strict (mirrors the mypy tests.* relaxation).
[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportMissingTypeArgument = false
reportArgumentType = false
reportReturnType = false
reportIncompatibleMethodOverride = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# FAIL-LOUD, the forge_testkit.config stance. The permissive default is a suite
# that swallows warnings, silently no-ops an unregistered @pytest.mark.foo, and
# silently ignores a malformed ini option — each one a place a real failure goes
# quiet. Every knob below closes one of those.
#
# asyncio_mode LIVES HERE, and that is the fix for a dead-config defect this
# rewrite found: the repo carried a `[tool.pytest-asyncio]` table with
# `mode = "auto"`, which nothing reads — pytest-asyncio takes `asyncio_mode`
# from THIS table. Measured 2026-08-22: an unmarked `async def test_` in that
# configuration does not run. The three async tests in the suite only ran
# because each carried an explicit @pytest.mark.asyncio. That table was exactly
# the class of thing foundry-stocks#5242 is about — a config entry naming a
# setting no tool consumes, which no linter in the fleet detects.
asyncio_mode = "auto"
addopts = "--cov=vault_mcp --cov-report=term-missing -m \"not live\" --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "live: requires live infra (deselect with -m 'not live')",
    "allow_network: this test is permitted to open real sockets",
]

[tool.forge_testkit_lint]
# Where this repo's Fake*/Stub* test-doubles are allowed to live. The
# fake-placement lint fails any Fake*/Stub* class defined outside it, which is
# what stops the five-copies-of-FakeVault pattern from growing back: before this
# rewrite the same class was hand-rolled in test_gate, test_compute,
# test_lifecycle, test_lint and test_audit, each a slightly different permissive
# dict, three of them missing methods the NoteIO protocol declares.
substrate_pkg = "tests.substrate"

[[tool.uv.index]]
name = "forgejo"
url = "https://forgejo.notusmi.com/api/packages/rob/pypi/simple/"

[tool.uv.sources]
# forge-testkit is published only to the Forgejo PyPI, so pin its source.
forge-testkit = { index = "forgejo" }
