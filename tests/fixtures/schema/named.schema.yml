# Fixture exercising schema-driven frontmatter: `name` label + auto `updated`.
pillars:
  - Knowledge

tags:
  - topic/ai

routes:
  - note_type: note
    pillar: Knowledge
    directory: Knowledge/Notes

frontmatter:
  label_field: name
  created_field: created
  updated_field: updated

required_frontmatter:
  - name
  - created
  - updated
  - author_type
  - author_level

write_protection: []

provenance:
  levels:
    - human
    - human-edited
    - human-revised
    - ai-assisted
    - ai-compiled
    - ai-metadata
    - ai-computed
