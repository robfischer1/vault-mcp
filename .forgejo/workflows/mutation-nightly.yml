# Caller stub — the nightly FULL mutation run (foundry-stocks track C1).
#
# Separate file from mutation.yml on purpose. Both triggers in one workflow means
# that on a pull_request the scheduled job reports `skipped`, and a required check
# reporting anything other than success is the hazard ci.yml spends a paragraph
# warning about. One trigger per file, one status per event.
#
# NOT GATED, deliberately — `fail-under: 0`. This is the number that tracks suite
# quality over time across the whole module, and it starts wherever the module's
# history left it. The PR gate (mutation.yml, fail-under 70) is what binds; this
# is what measures. Raise it once the trend is known.
#
# The first such run in the fleet (oceanus, 2026-08-19) scored 90.5% honest over
# 427 mutants — with 110 annotation-inert survivors excluded from BOTH sides of
# the ratio, which is the difference between that number and a misleading 67.2%.
name: mutation-nightly

on:
  # SCHEDULE REMOVED 2026-09-08 (Faraday14) — the nightly sweep OOM-killed on
  # llm01's shared act-runner lane (--memory=3g, capacity 6) at ~2.97 GiB RSS.
  # Measured: 4 kills 07:36-08:50Z (python family) and furnace-7431b30 at
  # 13:06:39Z on 09-07 (rust family), so both families exceeded the cap. Docker
  # reported OOMKilled=false throughout, because the kernel killed the child
  # process and not PID 1 — the container-level flag cannot see this class.
  # Manual dispatch only until the run is routed to a lane that fits it
  # (act-runner-bigmem: --memory=12g, capacity 1, label llm01-bigmem).
  workflow_dispatch:

jobs:
  mutation:
    uses: foundry/foundry-stocks/.forgejo/workflows/mutation.yml@main
    with:
      # bases.py WAS listed here. It is now a façade of re-export statements
      # (vault-mcp#5294), and mutating that would report a healthy score over
      # nothing while the 1400 lines of real logic went unmutated — a split
      # that quietly narrows a gate is worse than the file length it fixed.
      # The five modules it became are named instead, so coverage is unchanged.
      critical-modules: src/vault_mcp/bases_model.py src/vault_mcp/bases_parser.py src/vault_mcp/bases_eval.py src/vault_mcp/bases_exec.py src/vault_mcp/bases_io.py src/vault_mcp/rest_client.py
      mode: full
      fail-under: 0
    # pragma comment: detect-secrets flags the word 'secrets' as a Secret Keyword,
    # and `secrets: inherit` is the reusable-workflow idiom, not a credential.
    secrets: inherit  # pragma: allowlist secret
