      - id: sast-ruleset-lanes
        name: SAST ruleset declares every lane this repo builds (pre-push)
        # THE COMPANION TO THE ZERO-FILE REFUSAL BELOW, and it exists because that
        # refusal has one blind spot it structurally cannot close.
        #
        # The refusal fires on `Ran N rules on 0 files`. It catches a repo whose
        # ruleset matches NOTHING. It cannot catch a repo whose ruleset matches
        # SOMETHING and misses the rest — and that is the worse case, because a
        # non-zero file count reads as a real scan at every layer that looks.
        # foundry-stocks#4949 measured it: chaos scanned 28 of 2636 tracked files
        # and themis 26 of 2221, both exit 0, both green, with 74 and 44
        # first-party Go files that had never been examined by SAST.
        #
        # WHY A LANE CHECK RATHER THAN A FILE-COUNT THRESHOLD. "Ruleset languages
        # intersect actual file types" is the obvious test and it is too weak:
        # chaos's ruleset DID intersect its lanes (it has .py and declared python)
        # while its compiled half went unread. Any count threshold is also
        # arbitrary and would fire on incidental python — the hook scripts and
        # fixture generators every Go star carries. So the predicate is
        # STRUCTURAL instead: a go.mod means Go is a lane this repo builds, a
        # pyproject.toml means Python is, and a lane a repo builds is a lane its
        # security gate must name. That is a fact about the tree, not a heuristic.
        #
        # WHY IT HAS TO LIVE HERE. `rules/**` is `_skip_if_exists`, so a fixed
        # template ruleset can never reach a star that already has one — that is
        # what made #4415 undrainable and #4949 recur inside a day when chaos and
        # themis moved onto the Go template carrying their python rulesets.
        # `.pre-commit-config.yaml` is the mirror image: copier OWNS it, create
        # AND update, so a hook added here reaches every existing star on its next
        # update. It is the one surface that can close this class.
        #
        # Inline and dependency-free, for the same reason the opengrep hook below
        # is: stars on the per-family gates do not provision foundry-stocks, and
        # adding that coupling would break them.
        #
        # Verified before landing, across all 45 cloned repos carrying a
        # rules/sast: 43 pass, and the only two failures are cerberus and tron —
        # a stale python ruleset with NO opengrep hook to read it, which #4949 set
        # aside deliberately as an inert dead file rather than a security gap.
        # Negative control: a tree with go.mod and a python-only ruleset exits 2;
        # correcting the ruleset to [go] exits 0.
        entry: >-
          bash -c 'test -d rules/sast || exit 0;
          decl=$(cat rules/sast/*.yml 2>/dev/null | grep -vE "^[[:space:]]*#" | grep -oE "languages:[[:space:]]*\[[^]]*\]" | sed -E "s/.*\[//;s/\]//" | tr "," "\n" | sed -E "s/[^a-z]//g" | grep -vE "^$" | sort -u);
          missing="";
          for pair in go.mod:go Cargo.toml:rust pyproject.toml:python; do
          f=${pair%%:*}; lang=${pair##*:};
          test -f "$f" || continue;
          printf "%s\n" "$decl" | grep -qx "$lang" || missing="$missing $lang($f)";
          done;
          if test -f package.json; then
          printf "%s\n" "$decl" | grep -qxE "typescript|javascript" || missing="$missing typescript-or-javascript(package.json)";
          fi;
          test -z "$missing" && exit 0;
          echo "sast-ruleset-lanes: rules/sast declares [$(printf "%s" "$decl" | tr "\n" " ")] but this repo also builds:$missing" >&2;
          echo "A ruleset that never names a lane never examines it, and opengrep still exits 0 whenever some OTHER language matched - the partial-scan case the zero-file refusal cannot see (foundry-stocks#4949)." >&2;
          exit 2'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: opengrep-sast
        name: opengrep SAST (CI parity - pre-push; notice if absent)
        # REFUSES A ZERO-FILE SCAN. `Ran N rules on 0 files: 0 findings` exits 0 and
        # renders as Passed, which is indistinguishable from a clean scan. That is not
        # hypothetical: go-repo-template and rust-repo-template shipped the PYTHON
        # ruleset verbatim, so EVERY Go and Rust star ran a security gate that had
        # never examined a single file, and reported success every time
        # (foundry-stocks#4415). cerberus was worse - 29 .py and 37 .rs, so the count
        # looked plausible while the whole Rust surface went unscanned.
        #
        # Fixing the two rulesets fixes the instances. This fixes the CLASS: any future
        # languages/file-type mismatch is now loud on the first run instead of silent
        # forever. Same principle as the CANNOT-RUN branch below - a check that cannot
        # see anything must not answer "fine".
        #
        # Inline rather than a foundry-stocks script, deliberately: the opengrep hook
        # has no FOUNDRY_STOCKS dependency today, and stars still on the per-family
        # gates do not provision foundry-stocks on the go/rust/frontend lanes. Adding
        # that coupling mid-migration would break them.
        entry: >-
          bash -c 'command -v opengrep >/dev/null 2>&1 ||
          { echo "opengrep: CANNOT RUN - not installed (https://github.com/opengrep/opengrep). It is baked into every CI image, so this is a local gap only. Refusing to report success without scanning." >&2; exit 2; };
          export LANG=C.UTF-8 LC_ALL=C.UTF-8;
          out=$(opengrep scan --config rules/sast --error . 2>&1); rc=$?;
          printf "%s\n" "$out";
          if printf "%s" "$out" | grep -qE "Ran [0-9]+ rules on 0 files"; then
          echo "opengrep: REFUSING a zero-file scan. The ruleset matched no file in this repo, so 0 findings means NOTHING WAS EXAMINED - not that the code is clean. Check that rules/sast/dataflow.yml declares the language(s) this repo is actually written in." >&2;
          exit 2; fi;
          exit $rc'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: worktree-guard
        name: commit from a linked worktree, not the shared checkout
        entry: >-
          bash -c 'S="${FOUNDRY_STOCKS:-}"; C="${STOCKS_CACHE:-}";
