# Pre-commit hooks — the LOCAL half of the CI gate, so local and CI cannot drift.
# pre-commit stage: fast lint/hygiene (ruff, ruff-format, detect-secrets) + the
# forge-testkit test-body checks. pre-PUSH stage: the heavy checks the reusable
# python ci.yml runs (mypy, pyright, pytest, pip-audit, opengrep) — kept off
# `pre-commit` so commits stay fast, but run before a push reaches the door/CI.
# CI (the baked image) is the hard enforce; a dev box missing a non-project tool
# (opengrep) gets a notice, not a block.
#
# Install (copier _tasks does this on scaffold): `uv run pre-commit install`.
# default_install_hook_types wires pre-commit + post-commit in that one call
# (pre-push is the CA gate's file; see the note above that key). The
# .secrets.baseline is generated on first scaffold via `detect-secrets scan`.
#
# furnace owns .claude/ .specify/ .furnace/ (deployed by `furnace stoke`/`quench`).
# Exclude that managed surface from every hook: hygiene fixers would mangle the
# deployed content into drift, and detect-secrets trips on the manifest's hashes.
# NO pre-push HERE, DELIBERATELY (Continuous Accountability F4). `.git/hooks/
# pre-push` belongs to the CA gate now: it is written from the declared
# foundry-tools pin by foundry-stocks' copier task, and it CHAINS this file's
# pre-push stage itself (`pre-commit hook-impl --hook-type=pre-push`, the same
# flags and argv and stdin pre-commit's own generated hook uses) before it dials
# the engine — so not one check below is lost, and a red one still reds the push
# without paying for an engine round trip. Listing pre-push here would only make
# `pre-commit install` overwrite the gate with its own hook. The `stages:
# [pre-push]` markers below are UNTOUCHED and still authoritative: that key
# decides which hooks the pre-push stage runs, `default_install_hook_types`
# decides only which hook FILES `install` writes.
default_install_hook_types: [pre-commit, post-commit]
exclude: '^\.(claude|specify|furnace)/|(^|/)(vendor|node_modules)/|\.melt$'
